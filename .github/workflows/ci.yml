name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The floor declared in package.json engines. CI tests the floor deliberately:
  # running only the newest version is how an unsupported-syntax bug reaches a user.
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (ENGINEERING.md §9) — a moving tag is a supply-chain hole.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Build first. Packages resolve each other through their published `types` entry,
      # which points into dist/, so linting or typechecking a clean checkout before
      # building leaves every cross-package type unresolvable — and reports it as ~70
      # "unsafe any" errors rather than as the missing build it actually is.
      #
      # Checking against dist/ rather than src/ is the deliberate choice: it is the shape
      # consumers actually get, and this project's whole premise is that the packages work
      # when published. Turbo caches the build, so the cost is paid once.
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # R9 (the keyless localhost guarantee) is a tested promise, not an aspiration: the studio
  # must start and serve a lesson with no provider configured and no outbound network.
  # The job is written now so the guarantee has somewhere to live, but it is disabled until
  # Phase 2 delivers the app and the e2e package it drives. A job that fails permanently is
  # a job everyone learns to ignore, which is exactly how a guarantee quietly dies.
  #
  # TODO(phase-2): remove the `if: false` and add this to the required status checks.
  localhost-guarantee:
    name: Runs with no key and no network (R9)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Boot with no credentials
        run: pnpm --filter @explainer-studio/e2e run test:offline
        env:
          EXPLAINER_OFFLINE_ASSERT: '1'

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Secret scanning is GitHub's native feature, enabled in repository settings, not a
      # step here. It is free on public repositories and — unlike scanning after the fact —
      # push protection rejects a secret before it ever reaches the repository, which is the
      # only point at which the problem is still cheap. gitleaks-action was the obvious
      # choice but requires a paid licence for organisation-owned repositories.

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # An incompatible licence must fail the build, not surface at release time.
      - name: Licence compatibility
        run: pnpm dlx license-checker-rseidelsohn --production --onlyAllow "Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense;Python-2.0;BlueOak-1.0.0" --excludePrivatePackages

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

  # Enabled once packages exist and can actually be versioned (Phase 1).
  # TODO(phase-1): change the condition to `github.event_name == 'pull_request'`.
  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A public API change without a changeset means an unannounced break for consumers.
      - name: Require a changeset for package changes
        run: pnpm changeset status --since=origin/main
