version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per group: a small team cannot review twenty individual bumps a week,
      # and unreviewed dependency PRs are a supply-chain risk, not a hygiene win.
      dev-tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'vitest', 'tsup', 'turbo', 'typescript']
      production:
        patterns: ['*']
        exclude-patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'vitest', 'tsup', 'turbo', 'typescript']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
