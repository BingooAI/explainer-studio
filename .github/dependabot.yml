version: 2
updates:
  # One PR per group. A very small team cannot review twenty individual bumps a week, and
  # dependency PRs that pile up unreviewed are a supply-chain risk, not a hygiene win.
  # Grouping by dependency-type rather than by name patterns means a new dev tool is
  # classified correctly the day it is added, with no config change — the same
  # "no hardcoded list" principle the product itself follows (ENGINEERING.md R1).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      production-dependencies:
        dependency-type: production
        update-types: ['minor', 'patch']
    # Majors arrive as their own PR: they are the ones that actually need reading, and
    # burying one inside a group of twelve patches is how a breaking change slips through.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
